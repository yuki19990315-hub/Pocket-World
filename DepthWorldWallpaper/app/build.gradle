plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.depthworld.wallpaper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.depthworld.wallpaper'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.5.4'
    }

    // GitHub Actions injects a permanent signing key from repository secrets.
    // Without these variables, local developer builds use Android's debug key.
    signingConfigs {
        if (System.getenv('DEPTHWORLD_KEYSTORE_FILE') && System.getenv('DEPTHWORLD_SIGNING_PASSWORD')) {
            depthworld {
                storeFile file(System.getenv('DEPTHWORLD_KEYSTORE_FILE'))
                storePassword System.getenv('DEPTHWORLD_SIGNING_PASSWORD')
                keyAlias 'depthworld'
                keyPassword System.getenv('DEPTHWORLD_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('DEPTHWORLD_KEYSTORE_FILE') && System.getenv('DEPTHWORLD_SIGNING_PASSWORD')) {
                signingConfig signingConfigs.depthworld
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // On-device subject masks; the model is downloaded once by Google Play services.
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
}
