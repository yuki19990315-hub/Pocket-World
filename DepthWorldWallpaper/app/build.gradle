plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.depthworld.wallpaper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.depthworld.wallpaper'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.5.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // On-device subject masks; the model is downloaded once by Google Play services.
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
}
