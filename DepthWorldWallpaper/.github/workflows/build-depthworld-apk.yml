name: Build DepthWorld Wallpaper APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DepthWorldWallpaper/**'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-depthworld-apk.yml'
    branches:
      - 'feature/depthworld-wallpaper'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "Android SDK: ${ANDROID_HOME:-unset}"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Find Android project
        id: project
        shell: bash
        run: |
          if [ -f DepthWorldWallpaper/settings.gradle ]; then
            echo 'path=DepthWorldWallpaper' >> "$GITHUB_OUTPUT"
          elif [ -f settings.gradle ]; then
            echo 'path=.' >> "$GITHUB_OUTPUT"
          else
            echo 'DepthWorld Wallpaper project not found' >&2
            exit 1
          fi
      - name: Check source structure
        run: python3 "${{ steps.project.outputs.path }}/tests/verify_project.py"
      - name: Build APK
        run: bash "${{ steps.project.outputs.path }}/gradlew" -p "${{ steps.project.outputs.path }}" --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DepthWorldWallpaper-debug-apk
          path: |
            DepthWorldWallpaper/app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
