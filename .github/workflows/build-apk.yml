name: Build Sanny Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test world simulation and viewer
        run: |
          python3 -m unittest discover -s PocketWorld/tests -q
          node PocketWorld/tests/check_web_ui.js
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDK_MANAGER" ]; then
            echo 'Android sdkmanager was not found on this runner.' >&2
            exit 1
          fi
          "$SDK_MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: SannyCompanionAndroid
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SannyCompanion-debug-apk
          path: SannyCompanionAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
