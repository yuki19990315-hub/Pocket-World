name: Build DepthWorld Temporary APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/depthworld-wallpaper
    paths:
      - 'DepthWorldWallpaper/**'
      - '.github/workflows/build-depthworld-temp-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Check source
        run: python3 DepthWorldWallpaper/tests/verify_project.py
      - name: Build temporary APK
        run: bash DepthWorldWallpaper/gradlew -p DepthWorldWallpaper --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs DepthWorldWallpaper/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DepthWorldWallpaper-v0.5.4-temporary-debug-apk
          path: DepthWorldWallpaper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
